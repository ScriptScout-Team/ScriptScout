<div class="reset-container">

    <div class="reset-card">

        <h1>ScriptScout</h1>

        <h2>Reset Password</h2>

        <input
        type="password"
        placeholder="New Password"
        [(ngModel)]="password">

        <input
        type="password"
        placeholder="Confirm Password"
        [(ngModel)]="confirmPassword">

        <button (click)="resetPassword()">

            Update Password

        </button>

    </div>

</div>
