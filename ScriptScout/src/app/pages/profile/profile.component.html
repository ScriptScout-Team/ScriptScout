<app-sidebar></app-sidebar>

<div class="dashboard-content">

    <app-navbar></app-navbar>

    <div class="main">

        <!-- Header -->

        <div class="header">

            <div>

                <h2>Profile & Settings</h2>

                <p>
                    Manage your account information and preferences.
                </p>

            </div>

        </div>

        <!-- Profile Card -->

        <div class="profile-card">

            <!-- Left Side -->

            <div class="profile-image">

                <img
                    src="assets/profile.png"
                    alt="Profile">

                <button
                    class="change-photo"
                    (click)="changePhoto()">

                    Change Photo

                </button>

            </div>

            <!-- Right Side -->

            <div class="form">

                <div class="row">

                    <div class="form-group">

                        <label>Full Name</label>

                        <input
                            type="text"
                            [(ngModel)]="user.fullName">

                    </div>

                    <div class="form-group">

                        <label>Email</label>

                        <input
                            type="email"
                            [(ngModel)]="user.email">

                    </div>

                </div>

                <div class="row">

                    <div class="form-group">

                        <label>Phone Number</label>

                        <input
                            type="text"
                            [(ngModel)]="user.phone">

                    </div>

                    <div class="form-group">

                        <label>Role</label>

                        <input
                            type="text"
                            [(ngModel)]="user.role">

                    </div>

                </div>

                <div class="row">

                    <div class="form-group">

                        <label>Current Password</label>

                        <input
                            type="password"
                            [(ngModel)]="user.currentPassword">

                    </div>

                    <div class="form-group">

                        <label>New Password</label>

                        <input
                            type="password"
                            [(ngModel)]="user.newPassword">

                    </div>

                </div>

                <div class="row">

                    <div class="form-group">

                        <label>Language</label>

                        <select
                            [(ngModel)]="user.language">

                            <option>English</option>
                            <option>Telugu</option>
                            <option>Hindi</option>

                        </select>

                    </div>

                    <div class="form-group">

                        <label>Theme</label>

                        <select
                            [(ngModel)]="user.theme">

                            <option>Light</option>
                            <option>Dark</option>

                        </select>

                    </div>

                </div>

                <div class="settings">

                    <label>

                        <input
                            type="checkbox"
                            [(ngModel)]="user.notifications">

                        Enable Notifications

                    </label>

                    <label>

                        <input
                            type="checkbox"
                            [(ngModel)]="user.autoSave">

                        Enable Auto Save

                    </label>

                </div>

                <div class="buttons">

                    <button
                        class="reset-btn"
                        (click)="resetProfile()">

                        Reset

                    </button>

                    <button
                        class="save-btn"
                        (click)="saveProfile()">

                        Save Changes

                    </button>

                </div>

            </div>

        </div>

    </div>

</div>
